# Stack de la machine de test : le playground seul (pas de base). Seul état :
# la mise en page des diagrammes, dans le volume « layouts ».
# Port publié sur l'hôte : PLAYGROUND_PORT dans .env (complété par dev-deploy.sh).
# Le nom de stack vient de COMPOSE_PROJECT_NAME (.env) : jamais en dur, pour
# cohabiter avec les autres projets d'une machine partagée.
services:
  playground:
    build:
      context: .
      dockerfile: playground/Dockerfile
    image: urban-workflow-playground:dev
    restart: unless-stopped
    ports:
      - "${PLAYGROUND_PORT:-8777}:8000"
    # Volume nommé : les mises en page survivent aux redéploiements
    # (down/up), jamais purgé par dev-deploy.sh (il ne touche pas aux volumes).
    volumes:
      - layouts:/data/layouts
    # Rotation des journaux du conteneur : sans plafond, le fichier json-file
    # grossit sans fin sur une machine qui reste allumée.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  layouts:
