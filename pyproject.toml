[build-system]
# setuptools >= 77 : licence en expression SPDX (`license = "MIT"`),
# la forme en table TOML étant dépréciée (builds cassés après 2027-02-18).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-workflow"
version = "0.3.0"
description = "Workflow engine driven by a business DSL — Python port of Black-Beard-Sdk/Workflow, with JSON outputs normalized by urban-json (JSLT)."
readme = "README.en.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gael Beard", email = "gaelgael5@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "urban-json>=0.2.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/gaelgael5/urban-workflow"
Issues = "https://github.com/gaelgael5/urban-workflow/issues"

[project.optional-dependencies]
sql = [
    "sqlalchemy>=2.0",
]
schemas = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
]
# Le playground est une distribution séparée : pip install urban-workflow-playground
# (sous-projet playground/ de ce dépôt).
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "jsonschema>=4.18",
]

[tool.setuptools.packages.find]
include = ["urban_workflow*"]

[tool.setuptools.package-data]
# Les grammaires ANTLR et leur script de régénération sont livrés avec le
# paquet : sans eux, impossible de reconstruire le parseur depuis la
# distribution (le code généré, lui, est du .py embarqué comme module).
"urban_workflow.dsl" = ["grammar/*.g4", "grammar/regenerate.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["urban_workflow/dsl/generated"]

[tool.ruff.lint]
# Jeu de règles explicite : la CI ne dépend pas des défauts de ruff.
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# Imports après pytest.importorskip("sqlalchemy") : voulu.
"tests/test_storage_sql.py" = ["E402"]
