name: Release urban-workflow

# Publie urban-workflow (racine du dépôt) sur PyPI par trusted
# publishing (OIDC — aucun token stocké), sur tag vX.Y.Z.
# Publisher à déclarer sur pypi.org pour le projet urban-workflow :
#   owner: gaelgael5 · repository: urban-workflow
#   workflow: release-core.yml · environment: pypi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}  # publication manuelle (la version vient du pyproject)

jobs:
  publish:
    name: urban-workflow → PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérification tag ↔ version
        if: github.event_name == 'push'
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${{ github.ref_name }}" || {
            echo "tag ${{ github.ref_name }} ≠ version $version"; exit 1; }
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
