name: Release PyPI

# Publication par tags, via « trusted publishing » (OIDC — aucun token
# stocké) :
#   - tag v*            → publie urban-workflow (racine du dépôt)
#   - tag playground-v* → publie urban-workflow-playground (playground/)
#
# Prérequis (une fois, sur pypi.org, connecté au compte propriétaire) :
# ajouter un « pending publisher » pour CHAQUE projet avec exactement :
#   owner: gaelgael5 · repository: urban-workflow
#   workflow: release.yml · environment: pypi
# (PyPI → Your account → Publishing → Add a pending publisher.)

on:
  push:
    tags:
      - "v*"
      - "playground-v*"

jobs:
  publish-core:
    name: urban-workflow → PyPI
    if: ${{ !startsWith(github.ref_name, 'playground-') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérification tag ↔ version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${{ github.ref_name }}" || {
            echo "tag ${{ github.ref_name }} ≠ version $version"; exit 1; }
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-playground:
    name: urban-workflow-playground → PyPI
    if: ${{ startsWith(github.ref_name, 'playground-v') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérification tag ↔ version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('playground/pyproject.toml','rb'))['project']['version'])")
          test "playground-v$version" = "${{ github.ref_name }}" || {
            echo "tag ${{ github.ref_name }} ≠ version $version"; exit 1; }
      - run: python -m pip install build
      - run: python -m build playground/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: playground/dist/
