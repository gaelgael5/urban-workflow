name: Release urban-workflow-playground

# Publie urban-workflow-playground (sous-projet playground/) sur PyPI
# par trusted publishing (OIDC), sur tag playground-vX.Y.Z.
# Publisher à déclarer sur pypi.org pour le projet
# urban-workflow-playground :
#   owner: gaelgael5 · repository: urban-workflow
#   workflow: release-playground.yml · environment: pypi-playground

on:
  push:
    tags:
      - "playground-v*"
  workflow_dispatch: {}  # publication manuelle (la version vient du pyproject)

jobs:
  publish:
    name: urban-workflow-playground → PyPI
    runs-on: ubuntu-latest
    environment: pypi-playground
    permissions:
      id-token: write
      contents: write  # pose du tag de release en déclenchement manuel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérification tag ↔ version
        if: github.event_name == 'push'
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('playground/pyproject.toml','rb'))['project']['version'])")
          test "playground-v$version" = "${{ github.ref_name }}" || {
            echo "tag ${{ github.ref_name }} ≠ version $version"; exit 1; }
      - run: python -m pip install build
      - run: python -m build playground/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: playground/dist/
          skip-existing: true  # relance idempotente : version déjà publiée = no-op
      - name: Pose du tag de release (déclenchement manuel)
        if: github.event_name == 'workflow_dispatch'
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('playground/pyproject.toml','rb'))['project']['version'])")
          tag="playground-v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag déjà présent"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
