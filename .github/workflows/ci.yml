name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installation (extras dev + sous-projet playground)
        run: python -m pip install -e .[dev] -e ./playground
      - name: Tests
        run: python -m pytest -q

  tests-sans-sql:
    name: tests sans sqlalchemy (skip propre de l'extra [sql])
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation (cœur seul + pytest)
        run: python -m pip install -e . pytest
      - name: Tests (test_storage_sql doit être skippé)
        run: python -m pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check urban_workflow tests playground conftest.py
